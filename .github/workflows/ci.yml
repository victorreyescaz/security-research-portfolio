name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  hacktoken:
    name: HackToken remediation — full suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engagements/2026-09-hacktoken-remediation/code
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: forge build

      # Every proof of concept in this engagement was rewritten into the
      # regression that asserts the safe property, so there is no test left
      # failing by design and the whole suite is the signal.
      - name: Run tests
        run: forge test

  hackchain:
    name: HackChain review — regression suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engagements/2026-08-hackchain/code
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: forge build

      # test/exploits/ is excluded on purpose. Those proofs of concept assert
      # vulnerable behaviour, so neither their passing nor their failing means
      # the security properties hold. The job below checks them instead.
      - name: Run regression tests
        run: forge test --no-match-path 'test/exploits/*'

  hackchain-exploits-stay-closed:
    name: HackChain review — exploits stay closed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engagements/2026-08-hackchain/code
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # Stronger than skipping the exploits: each one that was left unmodified
      # must keep failing, and keep failing for the reason its remediation
      # produced. If a refactor removes a guard, the exploit passes again and
      # this job goes red.
      - name: Assert each closed exploit still fails for the right reason
        run: |
          set +e
          output=$(forge test --match-path 'test/exploits/*' 2>&1)
          code=$?
          set -e

          echo "$output"

          if [ $code -eq 0 ]; then
            echo "::error::Every exploit passed. At least one vulnerable path is open again."
            exit 1
          fi

          # HC-SRC-001 and HC-SRC-003 are not listed: their remediations changed
          # the interface the exploit called, so both were adapted and now pass.
          while IFS='|' read -r test_name reason; do
            [ -z "$test_name" ] && continue
            if ! echo "$output" | grep -qF "FAIL: ${reason}] ${test_name}"; then
              echo "::error::${test_name} is not failing with: ${reason}"
              exit 1
            fi
          done <<'EXPECTED'
testBlockedProfileCanStillOpenAStake|ProfileBlocked()
testRevokedEducatorCanStillReceiveEducatorBonus|NotEducator()
testUnregisteredRecruiterCanClaimMonthlyHiringBonus|NotRegistered()
testPenaltyWithZeroEvidenceLeavesProfileUnblocked|next call did not revert as expected
testPenaltyRoundingToZeroLeavesProfileUnblocked|next call did not revert as expected
testSettlingUnrelatedDebtLiftsManualBlock|el bloqueo manual se levanta al pagar una deuda que no lo puso
EXPECTED

          # forge prints each failure twice, inline and in the summary, so the
          # total comes from the summary line rather than from counting them.
          failed=$(echo "$output" | sed -n 's/^Encountered a total of \([0-9]*\) failing tests.*//p')
          if [ "$failed" != "6" ]; then
            echo "::error::Expected exactly 6 failing exploits, found ${failed}. An adapted proof of concept may have broken."
            exit 1
          fi

          echo "All six unmodified exploits fail for the reason their fix produced."
